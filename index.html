<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"

    />

    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Frontend Mentor | Social links profile</title>

        <p class="quote">"Studying Front-end to achieve mastery."</p>
        <div class="button-container">
          <a href="https://github.com/tianiixd" class="btn">Github</a>
          <a href="https://www.frontendmentor.io/profile/tianiixd" class="btn"
            >Frontend Mentor</a
          >
          <a href="https://www.facebook.com/christian.90921/" class="btn"
            >Facebook</a
          >
          <a href="https://www.instagram.com/tiaannchrisss/" class="btn"
            >Instagram</a
          >
          <a
            href="https://www.threads.com/@tiaannchrisss?xmt=AQF0gpo8Q2QvgjjZ1h05hfnEkQCqEAPtnOvfJ0x2lwOAA00"
            class="btn"
            >Threads</a
          >
        </div>
      </div>
    </div>
    <script src="./assets/js/script.js"></script>
  </body>
</html>
